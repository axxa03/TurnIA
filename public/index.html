<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reservá tu turno · TurnIA</title>
<meta name="description" content="Reservá online tu turno de peluquería y manicuría con presupuesto estimado y horarios reales.">
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/public.css">
</head>
<body>
<div id="app"><div class="wrap" style="padding:60px 16px">Cargando…</div></div>
<button id="chatBtn" class="chat-fab" aria-label="Abrir asistente">💬 Consultar</button>
<div id="chat" class="chat hide">
  <div class="chat-h"><div><b id="chatName">Asistente</b><div class="small muted" id="chatMode"></div></div><button class="btn sm ghost" onclick="Chat.toggle()" aria-label="Cerrar">✕</button></div>
  <div id="chatResume" class="chat-resume hide"><span id="chatStep"></span><button class="btn sm pri" onclick="Chat.resume()">Volver a mi reserva →</button></div>
  <div class="chat-b" id="chatLog"></div>
  <div class="chat-sug" id="chatSug"></div>
  <form class="chat-f" onsubmit="Chat.send(event)">
    <label class="btn sm" title="Adjuntar foto" style="margin:0;padding:8px 10px;cursor:pointer">📎<input type="file" accept="image/*" class="hide" onchange="Chat.photo(this)"></label>
    <input id="chatIn" placeholder="Escribí tu consulta…" autocomplete="off" maxlength="800"><button class="btn pri sm">Enviar</button></form>
</div>
<script src="/common.js"></script>
<script src="/public.js"></script>
</body>
</html>
